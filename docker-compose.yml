services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carboniq}
      POSTGRES_USER: ${POSTGRES_USER:-carboniq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carboniq_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - carboniq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_NAME: CarbonIQ API
      APP_VERSION: 0.1.0
      API_V1_PREFIX: /api/v1
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-carboniq}:${POSTGRES_PASSWORD:-carboniq_dev}@database:5432/${POSTGRES_DB:-carboniq}
      DATABASE_ECHO: "false"
      DATABASE_CONNECT_TIMEOUT: "5"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./services/api:/app
    depends_on:
      database:
        condition: service_healthy

volumes:
  carboniq_postgres_data:
