name: Backend CI

on:
  pull_request:
    paths:
      - "services/api/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://carboniq@localhost:5432/carboniq
      JWT_SECRET_KEY: ${{ github.sha }}-${{ github.run_id }}-carboniq-ci
      ENVIRONMENT: test
      DEBUG: "false"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: carboniq
          POSTGRES_USER: carboniq
          # Safe only because this database exists on an isolated disposable CI runner.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carboniq -d carboniq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/api/requirements-dev.txt
      - name: Install dependencies
        working-directory: services/api
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check migration graph
        working-directory: services/api
        run: python -m alembic heads
      - name: Run backend tests
        working-directory: services/api
        run: python -m pytest -q --tb=short
      - name: Compile backend sources
        working-directory: services/api
        run: python -m compileall -q app
